<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex — PokeAPI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-header__title">Pokédex</h1>
      <p class="site-header__subtitle">
        Consulta Pokémon con datos de
        <a href="https://pokeapi.co/" rel="noopener noreferrer" target="_blank"
          >PokeAPI</a
        >.
      </p>
    </header>

    <main class="main">
      <section class="search" aria-labelledby="search-heading">
        <h2 id="search-heading" class="search__title">Buscar Pokémon</h2>
        <form class="search__form" id="search-form" action="#" method="get" role="search">
          <label class="search__label" for="search-input">Nombre o número</label>
          <input
            class="search__input"
            id="search-input"
            name="q"
            type="search"
            autocomplete="off"
            placeholder="Ej: pikachu o 25"
            maxlength="120"
            required
          />
          <button class="search__submit" type="submit">Buscar</button>
        </form>
        <button class="search__random" type="button" id="random-button">
          Pokémon al azar
        </button>
      </section>

      <p class="status status--loading" id="status-loading" hidden aria-live="polite">
        Cargando…
      </p>
      <p
        class="status status--error"
        id="status-error"
        hidden
        role="alert"
        aria-live="assertive"
      ></p>

      <section
        class="pokemon-card"
        id="pokemon-section"
        aria-labelledby="pokemon-heading"
        hidden
      >
        <h2 id="pokemon-heading" class="pokemon-card__title">
          <span id="pokemon-name"></span>
        </h2>

        <div class="pokemon-card__media" id="pokemon-image-container">
          <!-- La imagen se insertará aquí con JS -->
        </div>

        <dl class="pokemon-card__stats">
          <div class="pokemon-card__stat">
            <dt>Peso</dt>
            <dd id="pokemon-weight"></dd>
          </div>
        </dl>

        <div class="pokemon-card__description">
          <h3 class="pokemon-card__section-title">Descripción</h3>
          <p id="pokemon-description"></p>
        </div>

        <div class="pokemon-card__types">
          <h3 class="pokemon-card__section-title">Tipos</h3>
          <ul class="pokemon-card__type-list" id="pokemon-types"></ul>
        </div>
      </section>

      <section
        class="type-explore"
        id="type-explore-section"
        aria-labelledby="type-explore-heading"
        hidden
      >
        <h2 id="type-explore-heading">Pokémon del tipo seleccionado</h2>
        <p class="type-explore__hint" id="type-explore-hint"></p>
        <ul class="type-explore__list" id="type-pokemon-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p class="site-footer__note">
        Datos de <a href="https://pokeapi.co/" rel="noopener noreferrer" target="_blank"
          >pokeapi.co</a
        >. Proyecto académico.
      </p>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
